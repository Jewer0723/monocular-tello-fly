# ============================================================
#  mission_command.yaml  –  Tello 巡檢任務指令配置
# ============================================================

frame:
  width: 640
  height: 480
  control_interval: 0.05

models:
  box_model_path:     "../model/box2.pt"
  barcode_model_path: "../model/barcode1.pt"
  box_conf:  0.70
  qr_conf:   0.70

mission:
  mode: 2
  hybrid_enabled: true
  auto_switch_enabled: true
  hybrid_mode1_timeout_sec: 15

inspection:
  qr_target_count: 10

  # 掃描平移設定
  roll_scan_speed: -20

  # [新增] 利用 MiDaS 維持掃描時與貨架的固定距離 (PID控制)
  maintain_distance_enabled: true
  target_depth: 0.5         # 預期維持的深度 (建議與 panel_approach_depth 一致)
  depth_tolerance: 0.06      # 容許誤差範圍 (Deadzone)
  depth_kp: 45               # 深度差異轉換為前後速度的比例係數
  max_fb_speed: 8            # 前後修正的最大速度 (避免修正過猛)

  # 定高控制已從程式移除：ROLL_SCAN 階段 ud 固定為 0。

  # 靠近面板判定（越小越早停，0.5防撞）
  panel_approach_depth: 0.5
  panel_roll_speed: -10

  # 面板轉向設定
  turn_180_speed: 35
  turn_tolerance_deg: 8

  # 走道切換（繞到另一條走道）
  aisle_change:
    steps:
      - action: roll_left
        speed: 15
        duration_sec: 3
        midas_clear_threshold: 0.20
      - action: yaw_right
        speed: 40
        target_deg: 90
      - action: roll_left
        speed: 15
        duration_sec: 3
        midas_clear_threshold: 0.20
      - action: yaw_right
        speed: 40
        target_deg: 90

midas:
  alt_change_interval_sec: 3.0
  alt_speed:               12
  alt_min_cm:              50
  alt_max_cm:              180
  base_forward_speed:      20
  turn_speed:              40
  obstacle_threshold:      0.35
  clear_threshold:         0.25
  turn_duration_sec:       1.5
  smoothing_window:        5
  target_found_area:       10000

forward:
  target_area:         100000
  area_tolerance:       15000
  kp_yaw:               0.30
  kp_updown:            0.30
  kp_forward:           0.0006
  max_speed:            20
  deadzone:             20
  min_area:             10000
  target_lost_timeout:  1
  max_execution_time:   30

circle:
  orbit_speed:              7
  yaw_correction_speed:     25
  height_correction_speed:  15
  min_circle_time_sec:      5
  max_circle_time_sec:      30
  target_lost_timeout:      1
  target_area:              120000
  area_tolerance:           5000
  kp_forward:               0.0006
  max_execution_time:       30

qr_scan:
  target_area:              60000
  area_tolerance:            5000
  kp_yaw:                   0.25
  kp_updown:                0.25
  kp_forward:               0.0006
  max_speed:                15
  deadzone:                 15
  target_lost_timeout:       3
  max_execution_time:       30
  qr_scan_interval_sec:     0.30
  direct_decode_enabled:    true
  direct_decode_interval_sec: 0.25
  forward_when_no_decode:   true
  min_area_before_decode:   40000
  csv_file:                 "scanned_codes.csv"
  event_csv_file:           "scan_events.csv"

low_battery:
  threshold_pct:         10
  check_interval_sec:     5
  return_speed:          20
  yaw_kp:               0.80

return_home:
  arrive_radius_cm:    30
  hover_sec:            2.0
  fly_speed:           50
  descend_speed:       -10
  target_height_cm:    50
  yaw_speed:           40
  return_altitude_cm:  150

rviz_bridge:
  host: "127.0.0.1"
  port: 9999